syntax = "proto3";

option csharp_namespace = "Spectator.Api.GrpcContracts";

package match;

service MatchIngest {
  rpc Push (MatchEventMsg) returns (Ack);
}

message MatchEventMsg {
  string match_id = 1;
  string type = 2;
  string payload_json = 3;
  int32 offset_seconds = 4;
}

message Ack {
  bool ok = 1;
}
